name: ratings
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ratings.mjs
        env:
          KP_TOKEN: ${{ secrets.KP_TOKEN }}
      - run: |
          git config user.name "ratings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ratings.json
          git diff --cached --quiet && exit 0
          git commit -m "Оценки агрегаторов"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
