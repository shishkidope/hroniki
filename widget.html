<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хроники: виджет</title>
<style>
:root{--card:#12161f;--text:#eef0f5;--muted:#8b93a7;--line:#232838;--accent:#9b7bff;--good:#4ade80;--ok:#fbbf24;--bad:#ff6b6b;--event:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{color:var(--text);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{position:absolute;left:0;top:0;width:560px;padding:10px;transform-origin:0 0}
.sec{margin:6px 0 10px;padding:4px 10px;border-radius:8px;background:#06080d;color:#c8d3ff;text-align:center;font-weight:800;font-size:26px;line-height:1.25;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;overflow:hidden;height:168px}
.cv{--w:96px;--d:14px;position:relative;width:var(--w);height:calc(var(--w)*1.5);perspective:700px}
.b{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(24deg)}
.f{position:absolute;backface-visibility:hidden}
.fr{inset:0;transform:translateZ(calc(var(--d)/2));border-radius:2px 4px 4px 2px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 3px 0 0 rgba(255,255,255,.2)}
.fr.im{background:var(--c2)}
.fr::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 48%,rgba(255,255,255,.1) 54%,transparent 64%)}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bk{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:var(--c2)}
.sp,.rt{top:0;height:100%;width:var(--d);left:calc(50% - var(--d)/2)}
.sp{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:var(--c2)}
.rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:linear-gradient(90deg,var(--c2),#000)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-size:19px;font-weight:650;margin:2px 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.event{font-size:13px;line-height:18px;color:var(--muted);margin-top:4px}.ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{display:flex;align-items:baseline;gap:4px;font-size:54px;line-height:1;font-weight:800;color:var(--rc);flex:none}
.rate small{font-size:17px;color:var(--muted);font-weight:500}
.drop{padding:4px 12px;border-radius:8px;border:2px solid var(--bad);color:var(--bad);font-weight:800;font-size:24px;flex:none}
.none{color:var(--muted);font-size:14px;flex:none}
.note{margin-top:8px;font-size:15px;line-height:21px;overflow:hidden;border-left:3px solid var(--accent);padding-left:10px;white-space:pre-line}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var N={games:2,movies:1,anime:1},POLL=90000,got=false;
function pic(w,h,c){return"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="'+c+'"/><circle cx="'+w/2+'" cy="'+h/2+'" r="'+h/4+'" fill="rgba(255,255,255,.4)"/></svg>')}
var DEMO={
games:[{t:"Bioshock Remastered",ev:'макс, мин сложность <span style="color:var(--event)">gge3</span>',ds:["2026-11-10","2026-06-02"],r:3,c:["#1d4e5f","#0b1a24"]},
{t:"Scarecrow: 90s Crime Story",ev:"ждал с демо",ds:["2026-11-03"],r:null,drop:true,c:["#c4622d","#3a1a1a"]},
{t:"Старая игра для примера",ds:["2025-06-14"],r:9,n:"Прошёл за три стрима.",c:["#4b3a7a","#1a1530"]}],
movies:[{t:"Клон (сериал 2001 – 2002)",ev:'<span style="color:var(--event)">ауд (топ 4, 1344.17, 12.1%)\nауд (топ 2, 4578, 35.7%)\nауд (топ 2, 3461, 37.7%)\nауд (топ 3, 3143, 21.5%)\nауд (топ 1, 2333, 34.6%)\nауд (топ 1, 4004, 35.4%)\nауд (топ 1, 2593, 35.2%)\nауд (топ 1, 6094, 62.2%)\nауд (топ 3, 1702, 16.1%)\nвыкуп Csalretepman</span>',ds:["2026-11-14"],r:null,n:"40 серий",c:["#b5702a","#2a1a10"]}],
anime:[{t:"Призрак в доспехах (сериал 2026)",ev:'выкуп <span style="color:var(--event)">2BeFirefly</span>',ds:["2026-11-12"],r:6,n:"3 серии",c:["#8a5a1a","#2a1a10"],i:pic(200,200,"#8a5a1a")}]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function last(x){return x.ds&&x.ds.length?x.ds.slice().sort().reverse()[0]:(x.l||x.d||"")}
var MN=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];function fmt(s){var p=s.split("-");return p.length==3?p[2]+"."+p[1]+"."+p[0]:p.length==2?MN[+p[1]-1]+" "+p[0]:s}
var F=fmt
function newest(a,n){return a.map(function(x,i){return[x,i]}).sort(function(p,q){var a=last(p[0]),b=last(q[0]);return a<b?1:a>b?-1:(q[0].ts||q[1])-(p[0].ts||p[1])}).slice(0,n).map(function(p){return p[0]})}
function lines(h){var out=[],st=[];(h||"").split("\n").forEach(function(l){var pre=st.map(function(t){return t[0]}).join("");l.replace(/<(\/?)(\w+)[^>]*>/g,function(m,c,n){if(c)st.pop();else if(!/^(br|img)$/i.test(n))st.push([m,n])});out.push(pre+l+st.slice().reverse().map(function(t){return"</"+t[1]+">"}).join(""))});return out}
function evh(h){var L=lines(h).filter(function(l){return l.replace(/<[^>]*>/g,"").trim()});if(!L.length)return"";var o=L.slice(0,2);if(L.length>2)o.push("…");return'<div class="event">'+o.map(function(l){return'<div class="ln">'+l+'</div>'}).join("")+'</div>'}
function clamp(){[].forEach.call(document.querySelectorAll(".note"),function(n){var c=n.closest(".card");n.style.display="block";n.style.webkitLineClamp="";var k=Math.floor((c.getBoundingClientRect().bottom-13-n.getBoundingClientRect().top)/21);if(k<1){n.style.display="none";return}n.style.display="-webkit-box";n.style.webkitBoxOrient="vertical";n.style.webkitLineClamp=k})}
function card(x){
var c=x.c||["#4b3a7a","#1a1530"];
var rate=x.drop?'<span class="drop">дроп</span>':x.r==null?'<span class="none">без оценки</span>':'<span class="rate" style="--rc:var(--'+(x.r>=8?'good':x.r>=5?'ok':'bad')+')">'+x.r+'<small>/10</small></span>';
var box='<div class="cv" style="--c1:'+c[0]+';--c2:'+c[1]+'"><div class="b"><div class="f fr'+(x.i?' im':'')+'">'+(x.i?'<img src="'+esc(x.i)+'" alt="">':'')+'</div><div class="f sp"></div><div class="f bk"></div><div class="f rt"></div></div></div>';
return '<div class="card">'+box+'<div><div class="top"><div><div class="date">'+F(last(x))+'</div><div class="title">'+esc(x.t)+'</div></div>'+rate+'</div>'+evh(x.ev)+(x.n?'<div class="note">'+x.n+'</div>':'')+'</div></div>'}
var T={games:"Игры",movies:"Фильмы | Сериалы | Мульты",anime:"Аниме"};
function fit(){var a=document.getElementById("app");a.style.transform="none";clamp();var W=a.offsetWidth,H=a.offsetHeight,s=Math.min(innerWidth/W,innerHeight/H);a.style.transform="translateX("+(innerWidth-W*s)/2+"px) scale("+s+")"}
function show(D){var h="";["games","movies","anime"].forEach(function(k){var L=newest(D[k]||[],N[k]);if(L.length)h+='<div class="sec">'+T[k]+'</div>'+L.map(card).join("")});document.getElementById("app").innerHTML=h;fit()}
addEventListener("resize",fit);
function load(){
fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(D){got=true;show(D)}).catch(function(){if(!got)show(DEMO)})}
load();setInterval(load,POLL);
</script>
</body>
</html>
