<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Хроники</title>
<style>
:root{--bg:#0b0e14;--card:#12161f;--text:#eef0f5;--muted:#8b93a7;--line:#232838;--accent:#9b7bff;--on-accent:#12101c;--good:#4ade80;--ok:#fbbf24;--bad:#ff6b6b;--event:#4ade80;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f8;--card:#fff;--text:#171b26;--muted:#5d6780;--line:#d9deea;--accent:#6d4cf0;--on-accent:#fff;--good:#1f9d55;--ok:#b7791f;--bad:#d64545;--event:#1f9d55;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1f3f8;--card:#fff;--text:#171b26;--muted:#5d6780;--line:#d9deea;--accent:#6d4cf0;--on-accent:#fff;--good:#1f9d55;--ok:#b7791f;--bad:#d64545;--event:#1f9d55;color-scheme:light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-y:scroll;overflow-x:hidden;max-width:100%;scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:840px;margin:0 auto;padding:20px 16px 60px;overflow-x:clip}
h1{font-size:28px;margin:8px 0 14px;letter-spacing:.5px;text-align:center;color:var(--hc,var(--text))}
nav{display:grid;gap:6px;margin-bottom:14px}
.n2{display:flex;gap:6px}
.n1 button{width:100%}
.n2 button{flex:1 1 0;min-width:0;white-space:normal;line-height:1.2;padding:8px 6px}
nav button,.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"],.chip.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.del{color:var(--bad);border-color:var(--bad);margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.ed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tools input,.tools select,.dl input:not([type=color]):not([type=file]),.dl select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
.tools input{flex:1 1 200px;width:auto}.tools select{width:auto}
.sec{margin:26px 0 10px;padding:4px 10px;border-radius:8px;background:var(--sec,#06080d);border:1px solid var(--line);color:var(--secfg,#c8d3ff);text-align:center;font-weight:800;font-size:clamp(15px,5.2vw,26px);line-height:1.25;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;cursor:pointer}

.card{content-visibility:auto;contain-intrinsic-size:auto 190px;position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.edit{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;line-height:1;z-index:2}
.edit:hover{border-color:var(--accent);color:var(--accent)}
.cv{--w:120px;--d:11px;position:relative;width:var(--w);height:calc(var(--w)*1.5)}
.box{width:100%;height:100%;perspective:700px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.b{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(var(--ry,24deg));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.b.drag{transition:none}
.f{position:absolute;backface-visibility:hidden}
.fr{inset:0;transform:translateZ(calc(var(--d)/2));border-radius:2px 4px 4px 2px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 3px 0 0 rgba(255,255,255,.2)}
.fr.im{background:var(--c2)}
.fr::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 48%,rgba(255,255,255,.1) 54%,transparent 64%);background-size:300% 100%;background-position:var(--sx,62%) 0;transition:background-position .6s cubic-bezier(.2,.8,.2,1)}
.b.drag .fr::after{transition:none}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.tt{position:absolute;left:0;right:0;bottom:0;padding:26px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));border-radius:0 0 4px 2px;color:#fff;font-weight:700;font-size:13px;line-height:1.2;pointer-events:none}
.bk{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:#2a2d34}
.sp,.rt{top:0;height:100%;width:var(--d);left:calc(50% - var(--d)/2)}
.sp{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 30%,rgba(0,0,0,.28)),linear-gradient(90deg,#8a909b,#e4e7ec 40%,#a3a9b4 62%,#6b7079);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 30%,rgba(0,0,0,.28)),linear-gradient(90deg,#6b7079,#a3a9b4 38%,#e4e7ec 60%,#8a909b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.cl a{display:block;margin-top:10px;text-align:center;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:6px;color:var(--text);text-decoration:none}
.cl a:hover{border-color:var(--accent);color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-right:10px}
.date{font-size:13px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-size:19px;font-weight:650;margin:2px 0}
.event{font-size:13px;color:var(--muted);white-space:pre-line;margin-top:4px}
.rate{display:flex;align-items:baseline;gap:4px;font-size:58px;line-height:1;font-weight:800;color:var(--rc);flex:none}
.rate small{font-size:18px;color:var(--muted);font-weight:500}
.drop{padding:4px 14px;border-radius:8px;border:2px solid var(--bad);color:var(--bad);font-weight:800;font-size:26px;flex:none}
.none{color:var(--muted);font-size:14px;flex:none}
.note{margin-top:10px;font-size:15px;border-left:3px solid var(--accent);padding-left:10px;white-space:pre-line}
.note a{color:var(--accent);word-break:break-all}
.rs{display:flex;flex-direction:row;align-items:flex-start;gap:14px;flex:none}.rs .ext{display:flex;margin-top:-2px}@media (max-width:520px){.rs{flex-direction:column-reverse;align-items:flex-end;gap:6px}.rs .ext{margin-top:0}}
a.ch{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;font-size:12px;line-height:1;color:var(--text);background:rgba(127,127,127,.08)}
a.ch:hover{border-color:var(--accent)}
a.ch i{display:flex;align-items:center;padding:5px 6px;background:rgba(127,127,127,.18)}
a.ch i svg{width:15px;height:15px;display:block}
a.ch span{padding:5px 7px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cc)}
.bk{overflow:hidden;border-radius:4px 2px 2px 4px}.bk::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 48%,rgba(255,255,255,.1) 54%,transparent 64%);background-size:300% 100%;background-position:calc(100% - var(--sx,62%)) 0;transition:background-position .6s cubic-bezier(.2,.8,.2,1)}.b.drag .bk::after{transition:none}.bk img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:brightness(.9)}
#up{position:fixed;right:16px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent);color:var(--on-accent);font-size:22px;line-height:1;cursor:pointer;z-index:15}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.crow input[type=color]{width:54px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.dl h3{margin:0;font-size:16px}.col{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0}.dl.cfg{max-width:min(920px,100%);grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}@media (max-width:800px){.dl.cfg{grid-template-columns:minmax(0,1fr)}}
@media (min-width:700px){html{zoom:1.25}.dl{max-height:calc(92vh/1.25)}}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;margin-top:6px}.row .event{margin-top:0;flex:0 0 230px;max-width:100%}@media (max-width:640px){.row .event:empty{display:none}}.row .note{margin-top:0;flex:1 1 150px;min-width:0}
.mon{margin:22px 0 10px;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:700;text-transform:capitalize}
.yr{margin:30px 0 8px;padding:12px;border-radius:10px;background:var(--text);color:var(--bg);font-size:34px;font-weight:800;text-align:center}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.demo{font-size:12px;color:var(--muted);margin-top:30px;text-align:center}
.ov{position:fixed;inset:0;overflow:hidden;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.dl{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:min(480px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dl label,.lb{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:4px;font-size:13px;color:var(--muted)}
.ed{min-height:56px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);white-space:pre-line;font-size:16px}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;font:inherit}
.tb .sw{min-width:26px;width:26px;height:26px;border-radius:50%}
.tb input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin:0}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}.dr,.cvr{display:flex;gap:6px}.dr input,.cvr input{flex:1;min-width:0}.dr button{flex:none;width:38px;padding:0}.cvr button{flex:none}
@media (max-width:480px){.card{grid-template-columns:96px minmax(0,1fr);gap:12px}.cv{--w:96px;--d:9px}}
</style>

<body>
<div class="wrap">
<h1>ХРОНИКИ</h1>
<nav id="nav" role="tablist"></nav>

</div>
<div class="ov" id="ov" hidden><div class="dl" role="dialog" aria-label="Редактирование записи">
<label id="e_kw">Раздел<select id="e_k"><option value="games">Игры</option><option value="movies">Фильмы | Сериалы | Мульты</option><option value="anime">Аниме</option></select></label>
<label>Название<input id="e_t"></label>
<div class="lb">Подпись под названием<div class="ed" id="e_ev" contenteditable="true"></div></div>
<div class="lb">Комментарий<div class="ed" id="e_n" contenteditable="true"></div></div>
<div class="tb" id="tb" aria-label="Оформление текста">
<button type="button" data-c="bold" title="Жирный"><b>Ж</b></button><button type="button" data-c="italic" title="Курсив"><i>К</i></button><button type="button" data-c="underline" title="Подчёркнутый"><u>Ч</u></button>
<span id="sw" class="tb"></span><input type="color" id="pick" value="#d24545" title="Свой цвет"><button type="button" data-c="removeFormat" title="Сбросить оформление">✕</button>
</div>

<label>Оценка<select id="e_r"></select></label>
<label id="e_plw">Плейлист YouTube<input id="e_pl"></label>
<label>Оценка агрегатора: ссылка или ID (пусто — автопоиск, «-» — скрыть)<input id="e_xid"></label>
<div class="lb">Обложка<div class="cvr"><input id="e_cv" placeholder="Вставь ссылку на картинку или выбери файл"><button type="button" class="chip" id="e_fb">Файл</button></div><input type="file" id="e_f" accept="image/*" hidden></div>
<div class="btns" id="b_edit"><button class="chip pri" id="e_s">Сохранить</button><button class="chip" id="e_u">Сохранить и поднять наверх</button><button class="chip" id="e_c">Отмена</button><button class="chip del" id="e_x">Удалить</button></div>
<div class="btns" id="b_new"><button class="chip pri" id="n_s">Добавить</button><button class="chip" id="n_c">Отмена</button></div>
<p class="hint">Правки сохраняются в GitHub, виджет обновится примерно через минуту.</p>
</div></div>
